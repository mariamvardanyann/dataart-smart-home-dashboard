name: Build and test

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore SmartHomeDashboard/SmartHomeDashboard.csproj
      - name: Build
        run: dotnet build SmartHomeDashboard/SmartHomeDashboard.csproj -c Release --no-restore
      - name: Integration tests
        run: python3 tests/test_dashboard_integration.py
      - name: Show server log on failure
        if: failure()
        run: cat integration-server.log || true
